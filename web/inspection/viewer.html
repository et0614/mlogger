<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Logger | 出荷時試験成績</title>
    <style>
        body { margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; color: #000; background: #fff; line-height: 1.7; }
        header { border-bottom: 2px solid #000; }
        .header-inner { max-width: 860px; margin: 0 auto; padding: 16px 20px; display: flex; justify-content: space-between; align-items: baseline; }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        main { max-width: 860px; margin: 0 auto; padding: 10px 20px 60px 20px; }
        h2 { border-left: 6px solid #000; padding-left: 10px; font-size: 1.15rem; margin-top: 40px; }
        h3 { font-size: 1.0rem; margin-top: 28px; }
        footer { border-top: 1px solid #000; text-align: center; padding: 16px; font-size: 0.85rem; }
        a { color: #000; }
        .monospace { font-family: "SFMono-Regular", Consolas, monospace; }
        .meta { font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.95rem; margin: 10px 0 20px 0; }
        .meta span { display: inline-block; margin-right: 30px; }
        .meta b { color: #555; font-weight: normal; margin-right: 6px; }
        .badge { display: inline-block; padding: 4px 18px; font-weight: bold; border: 2px solid #000; letter-spacing: 2px; }
        .badge.pass { background: #000; color: #fff; }
        .badge.fail { background: #fff; color: #b00; border-color: #b00; }
        .table-wrapper { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
        th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; }
        th { background: #f2f2f2; }
        td.num, th.num { text-align: right; font-family: "SFMono-Regular", Consolas, monospace; }
        td.ok { font-weight: bold; }
        td.ng { font-weight: bold; color: #b00; }
        .status { padding: 40px 20px; border: 1px dashed #000; text-align: center; margin: 40px 0; }
        .error h2 { border: none; padding: 0; margin: 0 0 10px 0; }
        .back-link { display: inline-block; margin-top: 20px; }
        .note { font-size: 0.85rem; color: #555; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>M-Logger</h1>
            <nav><a href="./">検索</a> / <a href="https://www.mlogger.jp/">HOME</a></nav>
        </div>
    </header>

    <main id="main">
        <div class="status" id="loading">読み込み中...</div>
    </main>

    <footer>
        &copy; Togashi Research Institute LLC
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = (params.get('id') || '').toUpperCase();
        const main = document.getElementById('main');

        // 風速プローブの校正成績ページ (プローブ device_id 6桁hex がキー)
        const CALIBRATION_URL = velId => `../velocity_calibration/viewer.html?id=${velId}`;

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g,
                c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function showError(title, body) {
            main.innerHTML = `
                <section class="status error">
                    <h2>${title}</h2>
                    <p>${body}</p>
                    <a class="back-link" href="./">&larr; 検索に戻る</a>
                </section>`;
        }

        // channel_stats のキー → 表示名・単位
        const CHANNEL_LABELS = {
            t:  ['乾球温度', '°C'],
            h:  ['相対湿度', '%'],
            g:  ['グローブ温度', '°C'],
            c:  ['CO2 濃度', 'ppm'],
            l:  ['照度', 'lx'],
            v:  ['風速', 'm/s'],
            vv: ['熱線ブリッジ電圧', 'mV'],
        };

        function probeRow(label, p, linkFn) {
            if (!p) return `<tr><td>${label}</td><td colspan="3">情報なし</td></tr>`;
            if (!p.connected) return `<tr><td>${label}</td><td colspan="3">未接続</td></tr>`;
            let idCell = `<span class="monospace">${esc(p.device_id)}</span>`;
            if (linkFn && p.device_id) {
                idCell = `<a class="monospace" href="${linkFn(esc(p.device_id))}">${esc(p.device_id)}</a>`;
            }
            return `<tr>
                <td>${label}</td>
                <td>${idCell}</td>
                <td>${esc(p.name)}</td>
                <td class="num">${esc(p.data_count)}</td>
            </tr>`;
        }

        function render(doc) {
            const dev = doc.device || {};
            const overall = doc.overall === 'PASS';

            let html = `
                <section>
                    <h2>デバイス <span class="monospace">${esc(dev.hardware_id)}</span></h2>
                    <p><span class="badge ${overall ? 'pass' : 'fail'}">${esc(doc.overall)}</span></p>
                    <div class="meta">
                        <span><b>試験日時:</b> ${esc(doc.timestamp)}</span>
                        <span><b>名称:</b> ${esc(dev.name)}</span>
                        <span><b>FW:</b> ${esc(dev.firmware_version)}</span>
                        <span><b>電池:</b> ${esc(dev.battery_mv)} mV</span>
                        <span><b>試験スクリプト:</b> v${esc(doc.script_version)}</span>
                    </div>
                </section>`;

            // 個体構成
            const radio = doc.radio || {};
            const probes = doc.probes || {};
            html += `
                <section>
                    <h2>個体構成</h2>
                    <div class="table-wrapper"><table>
                        <thead><tr><th>要素</th><th>ID</th><th>ラベル</th><th class="num">計測値数</th></tr></thead>
                        <tbody>
                            <tr><td>本体 (MCU)</td>
                                <td><span class="monospace">${esc(dev.hardware_id)}</span></td>
                                <td>${esc(dev.name)}</td><td class="num">-</td></tr>
                            <tr><td>無線モジュール (XBee)</td>
                                <td><span class="monospace">${esc(radio.xbee_mac ?? '-')}</span></td>
                                <td>FW ${esc(radio.xbee_fw ?? '-')}</td><td class="num">-</td></tr>
                            ${probeRow('温湿度・CO2・グローブ プローブ', probes.th_probe, null)}
                            ${probeRow('風速プローブ', probes.velocity_probe, CALIBRATION_URL)}
                        </tbody>
                    </table></div>
                    <p class="note">風速プローブの ID から風速-電圧特性の校正成績を参照できます (校正ページ整備後)。</p>
                </section>`;

            // 試験結果
            const items = (doc.items || []).map(it => `
                <tr>
                    <td>${esc(it.item)}</td>
                    <td class="${it.pass ? 'ok' : 'ng'}">${it.pass ? 'PASS' : 'FAIL'}</td>
                    <td class="monospace">${esc(it.detail)}</td>
                </tr>`).join('');
            html += `
                <section>
                    <h2>試験結果</h2>
                    <div class="table-wrapper"><table>
                        <thead><tr><th>項目</th><th>判定</th><th>詳細</th></tr></thead>
                        <tbody>${items}</tbody>
                    </table></div>
                </section>`;

            // 計測統計
            const stats = doc.channel_stats || {};
            const statRows = Object.keys(CHANNEL_LABELS)
                .filter(k => stats[k])
                .map(k => {
                    const s = stats[k];
                    const [label, unit] = CHANNEL_LABELS[k];
                    return `<tr>
                        <td>${label} [${unit}]</td>
                        <td class="num">${esc(s.n)}</td>
                        <td class="num">${esc(s.min)}</td>
                        <td class="num">${esc(s.mean)}</td>
                        <td class="num">${esc(s.max)}</td>
                    </tr>`;
                }).join('');
            if (statRows) {
                html += `
                    <section>
                        <h2>計測統計 (1 秒間隔サンプリング)</h2>
                        <div class="table-wrapper"><table>
                            <thead><tr><th>チャネル</th><th class="num">n</th><th class="num">最小</th><th class="num">平均</th><th class="num">最大</th></tr></thead>
                            <tbody>${statRows}</tbody>
                        </table></div>
                    </section>`;
            }

            // 補正係数
            const corr = doc.correction || {};
            const corrNames = {
                t_dry: '乾球温度', humidity: '相対湿度', t_glb: 'グローブ温度',
                illuminance: '照度', velocity: '風速',
            };
            const corrRows = Object.keys(corrNames)
                .filter(k => corr[k])
                .map(k => `<tr>
                    <td>${corrNames[k]}</td>
                    <td class="num">${esc(corr[k].a)}</td>
                    <td class="num">${esc(corr[k].b)}</td>
                </tr>`).join('');
            if (corrRows) {
                html += `
                    <section>
                        <h2>出荷時補正係数 (corrected = a &times; raw + b)</h2>
                        <div class="table-wrapper"><table>
                            <thead><tr><th>項目</th><th class="num">a</th><th class="num">b</th></tr></thead>
                            <tbody>${corrRows}</tbody>
                        </table></div>
                    </section>`;
            }

            document.title = `M-Logger | ${esc(dev.hardware_id)} 出荷時試験成績`;
            main.innerHTML = html;
        }

        if (!/^[0-9A-F]{8}$/.test(id)) {
            showError('ID が不正です', 'デバイス ID は 16 進数 8 桁 (0-9, A-F) です。');
        } else {
            fetch(`./reports/${id}.json`, {cache: 'no-cache'})
                .then(res => {
                    if (!res.ok) throw new Error(res.status);
                    return res.json();
                })
                .then(render)
                .catch(() => {
                    showError('見つかりません',
                        `デバイス <span class="monospace">${id}</span> の試験成績が見つかりませんでした。ID を確認してください。`);
                });
        }
    </script>
</body>
</html>
